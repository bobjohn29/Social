<!DOCTYPE html>
<html>
<head>
    <title>Velora</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: white;
            overflow: hidden;
        }

        #splash {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: white;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        #logo {
            color: red;
            font-size: 90px;
            font-weight: 900;
            font-family: Arial Black, Arial, sans-serif;
            letter-spacing: 8px;
            transform: skew(-8deg);
        }

        #main {
            display: none;
            width: 100%;
            height: 100vh;
            background: white;
        }
    </style>
</head>

<body>

    <div id="splash">
        <div id="logo">VELORA</div>
    </div>

    <div id="main"></div>

    <script>
        setTimeout(function () {
            document.getElementById("splash").style.display = "none";
            document.getElementById("main").style.display = "block";
        }, 3000);
    </script>

</body>
</html>
