<!DOCTYPE html>
<html>
<head>
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>Velora</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            background: white;
            overflow: hidden;
            position: fixed;
            touch-action: none;
            font-family: Arial, Helvetica, sans-serif;
        }

        #splash,
        #loading-screen,
        #welcome-page {
            position: fixed;
            inset: 0;
            background: white;
        }

        #splash {
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 30;
        }

        #logo {
            color: #ff0000;
            font-size: min(18vw, 120px);
            font-weight: 900;
            font-family: Arial Black, Arial, sans-serif;
            letter-spacing: 4px;
            text-align: center;
            width: 100%;
        }

        #loading-screen {
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 20;
        }

        .loading-circle {
            width: 55px;
            height: 55px;
            border: 6px solid #d1d1d1;
            border-top: 6px solid #777777;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        #welcome-page {
            display: none;
            z-index: 10;
            overflow: hidden;
        }

        .slides {
            width: 300vw;
            height: calc(100vh - 86px);
            display: flex;
            transition: transform 0.35s ease;
        }

        .slide {
            width: 100vw;
            height: calc(100vh - 86px);
            padding: 70px 28px 40px;
            text-align: center;
            flex-shrink: 0;
        }

        .game-grid {
            display: grid;
            grid-template-columns: repeat(6, 42px);
            gap: 10px;
            justify-content: center;
            margin-top: 20px;
        }

        .game-tile {
            width: 42px;
            height: 42px;
            border-radius: 5px;
            box-shadow: 0 10px 18px rgba(0, 0, 0, 0.12);
        }

        .tile1 { background: #ff6b6b; }
        .tile2 { background: #4dabf7; }
        .tile3 { background: #51cf66; }
        .tile4 { background: #ffd43b; }
        .tile5 { background: #845ef7; }
        .tile6 { background: #ff922b; }
        .tile7 { background: #20c997; }
        .tile8 { background: #f06595; }
        .tile9 { background: #748ffc; }
        .tile10 { background: #94d82d; }
        .tile11 { background: #adb5bd; }
        .tile12 { background: #339af0; }
        .tile13 { background: #ff8787; }
        .tile14 { background: #69db7c; }
        .tile15 { background: #fcc419; }
        .tile16 { background: #9775fa; }
        .tile17 { background: #ffa94d; }
        .tile18 { background: #38d9a9; }

        .studio-preview {
            width: 270px;
            height: 170px;
            margin: 35px auto 0;
            border-radius: 12px;
            background: #f1f3f5;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            padding: 18px;
            box-shadow: 0 12px 25px rgba(0, 0, 0, 0.12);
        }

        .studio-block {
            border-radius: 6px;
            background: #bdbdbd;
        }

        .share-preview {
            width: 250px;
            height: 160px;
            margin: 40px auto 0;
            border-radius: 18px;
            background: #e9ecef;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 64px;
            font-weight: 900;
            color: #999;
            box-shadow: 0 12px 25px rgba(0, 0, 0, 0.12);
        }

        .welcome-title {
            margin-top: 95px;
            font-size: 21px;
            font-weight: 800;
            color: #222;
        }

        .welcome-text {
            margin: 22px auto 0;
            max-width: 320px;
            font-size: 17px;
            line-height: 1.35;
            color: #b8b8b8;
            font-weight: 600;
        }

        .dots {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 105px;
            display: flex;
            justify-content: center;
            gap: 10px;
        }

        .dot {
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background: #d0d0d0;
        }

        .dot.active {
            background: #555;
        }

        .bottom-buttons {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 0;
            height: 86px;
            display: flex;
            background: white;
            box-shadow: 0 -4px 18px rgba(0, 0, 0, 0.08);
        }

        .bottom-buttons button {
            width: 50%;
            border: none;
            font-size: 20px;
            font-weight: 800;
            cursor: pointer;
        }

        .login-btn {
            background: white;
            color: #222;
        }

        .signup-btn {
            background: #00a8ff;
            color: white;
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.35);
        }

        @keyframes spin {
            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>

    <div id="splash">
        <div id="logo">VELORA</div>
    </div>

    <div id="loading-screen">
        <div class="loading-circle"></div>
    </div>

    <div id="welcome-page">
        <div class="slides" id="slides">

            <section class="slide">
                <div class="game-grid">
                    <div class="game-tile tile1"></div>
                    <div class="game-tile tile2"></div>
                    <div class="game-tile tile3"></div>
                    <div class="game-tile tile4"></div>
                    <div class="game-tile tile5"></div>
                    <div class="game-tile tile6"></div>
                    <div class="game-tile tile7"></div>
                    <div class="game-tile tile8"></div>
                    <div class="game-tile tile9"></div>
                    <div class="game-tile tile10"></div>
                    <div class="game-tile tile11"></div>
                    <div class="game-tile tile12"></div>
                    <div class="game-tile tile13"></div>
                    <div class="game-tile tile14"></div>
                    <div class="game-tile tile15"></div>
                    <div class="game-tile tile16"></div>
                    <div class="game-tile tile17"></div>
                    <div class="game-tile tile18"></div>
                </div>

                <h1 class="welcome-title">Experience User-Generated Games</h1>
                <p class="welcome-text">Explore unique games created by Velora users.</p>
            </section>

            <section class="slide">
                <div class="studio-preview">
                    <div class="studio-block"></div>
                    <div class="studio-block"></div>
                    <div class="studio-block"></div>
                    <div class="studio-block"></div>
                    <div class="studio-block"></div>
                    <div class="studio-block"></div>
                    <div class="studio-block"></div>
                    <div class="studio-block"></div>
                </div>

                <h1 class="welcome-title">Create Your Own Worlds</h1>
                <p class="welcome-text">Use Velora Studio to build games, levels, and ideas.</p>
            </section>

            <section class="slide">
                <div class="share-preview">V</div>

                <h1 class="welcome-title">Share With Friends</h1>
                <p class="welcome-text">Publish your games and let other people play them.</p>
            </section>

        </div>

        <div class="dots">
            <div class="dot active" id="dot0"></div>
            <div class="dot" id="dot1"></div>
            <div class="dot" id="dot2"></div>
        </div>

        <div class="bottom-buttons">
            <button class="login-btn">Log in</button>
            <button class="signup-btn">Sign up</button>
        </div>
    </div>

    <script>
        const splash = document.getElementById("splash");
        const loadingScreen = document.getElementById("loading-screen");
        const welcomePage = document.getElementById("welcome-page");
        const slides = document.getElementById("slides");

        let currentSlide = 0;
        let startX = 0;
        let endX = 0;

        function updateSlide() {
            slides.style.transform = "translateX(-" + (currentSlide * 100) + "vw)";

            document.getElementById("dot0").classList.remove("active");
            document.getElementById("dot1").classList.remove("active");
            document.getElementById("dot2").classList.remove("active");

            document.getElementById("dot" + currentSlide).classList.add("active");
        }

        setTimeout(function () {
            splash.style.display = "none";
            loadingScreen.style.display = "flex";

            setTimeout(function () {
                loadingScreen.style.display = "none";
                welcomePage.style.display = "block";
            }, 3000);

        }, 3000);

        welcomePage.addEventListener("touchstart", function (e) {
            startX = e.touches[0].clientX;
        });

        welcomePage.addEventListener("touchend", function (e) {
            endX = e.changedTouches[0].clientX;
            handleSwipe();
        });

        welcomePage.addEventListener("mousedown", function (e) {
            startX = e.clientX;
        });

        welcomePage.addEventListener("mouseup", function (e) {
            endX = e.clientX;
            handleSwipe();
        });

        function handleSwipe() {
            const swipeDistance = startX - endX;

            if (swipeDistance > 50 && currentSlide < 2) {
                currentSlide++;
                updateSlide();
            }

            if (swipeDistance < -50 && currentSlide > 0) {
                currentSlide--;
                updateSlide();
            }
        }

        document.addEventListener("gesturestart", function (e) {
            e.preventDefault();
        });

        document.addEventListener("wheel", function (e) {
            if (e.ctrlKey) {
                e.preventDefault();
            }
        }, { passive: false });

        document.addEventListener("touchmove", function (e) {
            e.preventDefault();
        }, { passive: false });
    </script>

</body>
</html>
